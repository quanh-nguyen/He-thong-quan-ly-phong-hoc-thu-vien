<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/">Trang chủ</a>
            <a href="/dashboard">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h2>Dashboard quản lý phòng học</h2>
        <p>Ngày hiện tại: <span id="current-date"></span></p>

        <div class="card-grid">
            <div class="card room-card" data-room="P101">
                <h3>P101</h3>
                <p>Sức chứa: 30</p>
                <span class="status available">Có sẵn</span>
            </div>
            <div class="card room-card" data-room="P102">
                <h3>P102</h3>
                <p>Sức chứa: 20</p>
                <span class="status booked">Đã đặt</span>
            </div>
            <div class="card room-card" data-room="P103">
                <h3>P103</h3>
                <p>Sức chứa: 25</p>
                <span class="status booked">Bảo trì</span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
